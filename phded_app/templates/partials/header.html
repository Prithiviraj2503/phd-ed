{% load static %}
<header class="phded-header">
    <div class="container-fluid">
        <div class="nk-header-bar d-flex align-items-center justify-content-between">
            <button type="button" id="sidebarCollapse" class="btn text-white p-0 me-3 border-0 text-decoration-none" style="font-size:20px;" aria-label="Toggle menu">
                <i class="bi bi-list"></i>
            </button>
            <div class="nk-header-search d-none d-lg-block">
                <input type="text" class="nk-search-input" placeholder="Search...">
                <i class="bi bi-search nk-search-icon"></i>
            </div>
            <div class="nk-header-right ms-auto d-flex align-items-center gap-2">
                <div class="dropdown">
                    <a href="#" class="nk-header-icon nk-header-user text-white text-decoration-none d-flex align-items-center" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1" style="font-size:1.25rem;"></i>
                        <span class="nk-user-name d-none d-md-inline">{{ request.session.user_name|default:"User" }}</span>
                        <i class="bi bi-chevron-down ms-1" style="font-size:12px;"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item phded-logout-link" href="{% url 'phded_app:logout' %}"><i class="bi bi-box-arrow-right me-2"></i>Log Out</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</header>
